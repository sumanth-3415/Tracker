<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- App Background Icon Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#tm-grad)" />
  <!-- Background Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.08" />
  
  <!-- Outer Check Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-dasharray="750 200" opacity="0.9" />
  
  <!-- Checkmark Path -->
  <path d="M 170 260 L 230 320 L 350 190" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Flame Badge at Top-Right Corner -->
  <g transform="translate(320, 110) scale(0.9)" filter="url(#glow)">
    <path d="M40 0 C45 25 70 40 70 70 C70 95 50 115 25 115 C0 115 -20 95 -20 70 C-20 45 5 30 15 15 C20 30 30 35 35 35 C40 25 35 15 40 0 Z" fill="url(#flame-grad)" />
    <path d="M30 45 C32 55 45 65 45 80 C45 92 35 102 22 102 C10 102 0 92 0 80 C0 68 15 60 20 50 Z" fill="#fbbf24" opacity="0.9" />
  </g>
</svg>

